name: SDK

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    runs-on: ubuntu-latest
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Check SDK and support libraries
        run: nix develop .#build --command just checks
      - name: Run unit tests
        run: nix develop .#build --command just unit
      - name: Run documentation tests
        run: nix develop .#build --command just test-doc
      - name: Build SDK documentation
        run: nix develop .#build --command just rustdocs
