[package]
name = "sapling-testing"
version = "0.0.0"
license = "MIT"
edition = "2024"
publish = false
autotests = false
autobins = false
autoexamples = false

[[test]]
name = "sapling-sdk"
path = "tests/sdk/mod.rs"
required-features = ["integration"]

[features]
default = []
# Upstream server/application dependencies are never part of the default build.
integration = [
	"dep:ark-testing",
	"dep:bark-server",
	"dep:bark-server-log",
	"dep:bark-cln-rpc",
	"dep:ark-lib",
	"dep:bark-server-rpc",
	"dep:sapling-sdk",
	"dep:bark-bitcoin-ext",
	"dep:bip321",
	"dep:bitcoincore-rpc",
	"dep:anyhow",
	"dep:bitcoin",
	"dep:bip39",
	"dep:serde_json",
	"dep:futures",
	"dep:tokio-stream",
	"dep:tonic",
	"dep:async-trait",
	"dep:parking_lot",
	"dep:tokio",
	"dep:serde",
	"dep:toml",
]
# Requires the real local-dev TEE and evaluator WASM; missing artifacts fail.
sapio-integration = ["integration", "dep:reqwest", "dep:axum"]

[dependencies]
ark-testing = { git = "https://gitlab.com/ark-bitcoin/bark.git", rev = "626c9b241dd25d73212915d8fca959ab5e3b8f1f", optional = true }
bark-server = { git = "https://gitlab.com/ark-bitcoin/bark.git", rev = "626c9b241dd25d73212915d8fca959ab5e3b8f1f", optional = true }
bark-server-log = { git = "https://gitlab.com/ark-bitcoin/bark.git", rev = "626c9b241dd25d73212915d8fca959ab5e3b8f1f", optional = true }
bark-cln-rpc = { git = "https://gitlab.com/ark-bitcoin/bark.git", rev = "626c9b241dd25d73212915d8fca959ab5e3b8f1f", optional = true }
ark-lib = { path = "../protocol", features = ["test-util"], optional = true }
bark-server-rpc = { path = "../rpc", features = ["server"], optional = true }
sapling-sdk = { path = "../sdk", features = ["sqlite", "onchain-bdk", "socks5-proxy"], optional = true }
bark-bitcoin-ext = { workspace = true, features = ["rpc"], optional = true }
bip321 = { workspace = true, optional = true }
bitcoincore-rpc = { version = "0.19.0", optional = true }
anyhow = { workspace = true, optional = true }
bitcoin = { workspace = true, optional = true }
bip39 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
tokio = { workspace = true, features = ["process", "macros", "rt-multi-thread", "fs"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
toml = { version = "0.9", optional = true }
reqwest = { version = "^0.13", default-features = false, features = ["json"], optional = true }
axum = { version = "0.8.4", features = ["macros", "tokio", "query"], default-features = false, optional = true }
