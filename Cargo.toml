[workspace]
members = ["sdk", "protocol", "rpc", "testing"]
default-members = ["sdk", "protocol", "rpc"]
resolver = "2"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
overflow-checks = true
lto = true

# The optional integration fixtures use these same protocol types. The SDK's
# own path dependencies do not require downstream consumers to add patches.
[patch."https://gitlab.com/ark-bitcoin/bark.git"]
ark-lib = { path = "protocol" }
bark-server-rpc = { path = "rpc" }

[workspace.dependencies]
# Unmodified upstream libraries, pinned to the base of the Sapling client fork.
bark-common = { git = "https://gitlab.com/ark-bitcoin/bark.git", rev = "626c9b241dd25d73212915d8fca959ab5e3b8f1f" }
bark-runtime = { git = "https://gitlab.com/ark-bitcoin/bark.git", rev = "626c9b241dd25d73212915d8fca959ab5e3b8f1f" }
bark-bitcoin-ext = { git = "https://gitlab.com/ark-bitcoin/bark.git", rev = "626c9b241dd25d73212915d8fca959ab5e3b8f1f", default-features = false }
bip321 = { git = "https://gitlab.com/ark-bitcoin/bark.git", rev = "626c9b241dd25d73212915d8fca959ab5e3b8f1f" }

bitcoin = { version = "0.32.7", features = ["serde", "rand", "rand-std"] }
lightning-invoice = { version = "0.34.0", features = ["std", "serde"] }
lightning = { version = "0.2.0", default-features = false, features = ["std"] }
lnurl-rs = { version = "0.10.0", features = ["async", "async-https-rustls"], default-features = false }
anyhow = { version = "1.0", features = ["backtrace"] }
thiserror = "2.0.12"
log = { version = "0.4.27", features = ["kv", "kv_serde"] }
serde = "1.0.219"
serde_json = { version = "1", features = ["raw_value"] }
lazy_static = "=1.5.0"
chrono = { version = "0.4", features = ["serde"] }
rmp-serde = "1.3.0"
config = "0.15.6"
parking_lot = "0.12.4"
async-trait = "0.1.83"
futures = "0.3.30"

tonic = { version = "0.14.2", features = ["tls-webpki-roots", "gzip", "zstd"] }
prost = "0.14.1"
prost-types = "0.14.1"
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"
http = "1.2.0"
hyper-socks2 = { version = "0.9.1", default-features = false }
hyper-util = { version = "0.1.20", features = ["tokio", "client-legacy"] }
tokio = { version = "1.35", default-features = false }
tokio-util = { version = "0.7.14", default-features = false }
tokio-stream = { version = "0.1.14", features = ["sync"], default-features = false }

bip39 = { version = "2.0.0", features = ["rand"] }
rand = { version = "0.10.1", features = ["std", "std_rng"] }
bdk_wallet = "3.1.0"
bdk_core = { version = "0.6.1", default-features = false }
bdk_esplora = { version = "0.22.1", features = ["std", "async-https-rustls", "tokio"], default-features = false }
esplora-client = { version = "0.12.3", default-features = false, features = ["async", "async-https-rustls", "tokio"] }
bdk_bitcoind_rpc = "0.22.0"
bitcoind-async-client = { version = "0.15.0", features = ["raw_rpc"] }
